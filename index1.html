
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Image Gallery</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <header>
        <h1>Pixel Gallery</h1>
        <p>Explore the beauty of the world</p>
    </header>

  
       
<main class="gallery" id="gallery">

    <img src="village.jpg" alt="Beautiful Village">

    <img src="village1.jpg"
         alt="Green Fields">

    <img src="village2.jpg"
         alt="Village Nature">

    <img src="village3.jpg"
         alt="Green Forest">

    <img src="village4.jpg"
         alt="Countryside View">

    <img src="village5.jpg"
         alt="Sunset View">

</main>


    <div class="lightbox" id="lightbox">
        <button id="close" aria-label="Close image">&times;</button>
        <button id="prev" aria-label="Previous image">&#10094;</button>
        <img id="largeImage" src="" alt="Selected gallery image">
        <button id="next" aria-label="Next image">&#10095;</button>
        <p id="caption"></p>
    </div>

    <footer>
        <p>Created by Palak</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
